specVersion: 2
id: fomo4good
did: did:blocklet:fomo4good
name: FOMO4GOOD
description: The last donor wins nothing. Their charity gets the pool.
version: 0.1.0
logo: logo.svg
license: MIT
author:
  name: FOMO4GOOD
repository:
  type: git
  url: https://github.com/ArcBlock/FOMO4GOOD
  directory: blocklets/fomo4good
keywords: [charity, donations, usdc]
tags: [charity]
surfaces: [/]
# domains[0] is the SEO host: pre-render bakes it into canonical / og:url /
# sitemap in EVERY environment (staging included — same as aside), so it is
# the production domain. `arc deploy --server` registers every entry with the
# target host first-come; a published copy also resolves by its id
# (`fomo4good.<domain root>`, e.g. fomo4good.afsd.io on staging).
# fomo4good.localhost is the local `npm run dev` host.
sites:
  - name: fomo4good
    domains: [fomo4good.com, fomo4good.localhost]

collections:
  # Charity teams — page data bound through `pages/*/sources/teams`. Faces
  # off: /teams is the custom campaign page, not a generated list.
  teams:
    type: local:team
    scope: /packages
    indexable: ["content/teams/**/content.md"]
    readRole: guest
    access: public
    faces:
      web: false
      sitemap: false
      jsonld: false
  # Practice world sub-pages: /practice is the custom list page
  # (pages/practice/layout.aup), each record is one /practice/{view} page
  # rendered by pages/practice/[slug]/layout.aup.
  practice:
    type: local:practice
    scope: /packages
    indexable: ["content/practice/**/content.md"]
    readRole: guest
    access: public
    faces:
      web: true
      sitemap: true
      jsonld: false
  media:
    type: local:media
    scope: /packages
    indexable: ["content/media/**/content.md"]
    readRole: guest
    access: public
    faces:
      web: false
      sitemap: false
      jsonld: false
