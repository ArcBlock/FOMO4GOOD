name: Deploy Blocklet to Staging

# Staging ships on every push to main that touches the Blocklet, or by hand.
# Modeled on aside's deploy-blocklet-staging.yml: install the released arc CLI,
# `arc deploy --server` the Blocklet into the staging DID Space, purge the HTML
# edge cache, then smoke the live pages.
on:
  push:
    branches: [main]
    paths:
      - "blocklets/fomo4good/**"
      - ".github/workflows/deploy-blocklet-staging.yml"
      - ".github/scripts/**"
  workflow_dispatch:

permissions:
  contents: read

# Point arc's AUP asset loader at the public CDN for every step in this workflow.
#
# The pre-rendered pages reference the shell assets (aup-core.css / aup-ssr.js)
# by build hash; only released arc builds have those hashes published at
# aup.arcblock.io, which is also why the CLI below comes from install.sh and not
# from a source checkout. This value is part of the pre-render fingerprint, so
# it MUST stay byte-identical across the deploy workflows here.
env:
  ARC_AUP_ASSETS_CDN: https://aup.arcblock.io

concurrency:
  group: deploy-blocklet-staging
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy blocklet to staging DID Space
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check staging deploy config
        env:
          ARC_DEPLOY_SERVER: ${{ secrets.ARC_DEPLOY_SERVER_STAGING }}
          ARC_DEPLOY_TOKEN: ${{ secrets.ARC_DEPLOY_TOKEN_STAGING }}
        run: |
          test -n "$ARC_DEPLOY_SERVER" || {
            echo "::error::Set ARC_DEPLOY_SERVER_STAGING as an org/repo/environment secret."
            exit 1
          }
          test -n "$ARC_DEPLOY_TOKEN" || {
            echo "::error::Set ARC_DEPLOY_TOKEN_STAGING as a staging environment or repository secret."
            exit 1
          }

      - name: Install arc CLI
        run: |
          curl -fsSL https://arc.afsd.io/install.sh | bash
          # install.sh unpacks to ~/.arc/versions/<v> and points ~/.arc/current
          # at it; the arc launcher lives at ~/.arc/current/arc. Put that dir on
          # PATH for subsequent steps (the rc-file edit install.sh does won't
          # apply to non-login CI shells).
          echo "$HOME/.arc/current" >> "$GITHUB_PATH"

      - name: Verify arc CLI
        run: arc --version

      - name: Check the blocklet
        run: |
          arc dsl lint blocklets/fomo4good
          arc dsl validate blocklets/fomo4good
          arc blocklet check blocklets/fomo4good

      - name: Deploy blocklet to staging
        env:
          ARC_DEPLOY_SERVER: ${{ secrets.ARC_DEPLOY_SERVER_STAGING }}
          ARC_DEPLOY_TOKEN: ${{ secrets.ARC_DEPLOY_TOKEN_STAGING }}
          # Per-batch prepare/PUT/commit timings — `arc deploy`'s own phase
          # summary says WHICH phase, this says which leg of the upload. NOT part
          # of the pre-render fingerprint, so unlike ARC_AUP_ASSETS_CDN it cannot
          # cost a cache hit.
          ARC_LOG: node:deploy
        run: |
          arc deploy blocklets/fomo4good \
            --server "$ARC_DEPLOY_SERVER" \
            --token "$ARC_DEPLOY_TOKEN" \
            --no-browser

      - name: Purge staging HTML edge cache
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          FETCH_HOST: ${{ vars.STAGING_SITE_HOST || 'fomo4good.afsd.io' }}
        run: node .github/scripts/purge-html-cache.mjs

      # SEO_HOST is fomo4good.com here too, on purpose — see smoke-site.mjs: the
      # canonical/sitemap host comes from `sites[].domains[0]` at pre-render
      # time, so staging bakes the production domain by design.
      - name: Smoke check
        id: smoke
        env:
          FETCH_HOST: ${{ vars.STAGING_SITE_HOST || 'fomo4good.afsd.io' }}
          SEO_HOST: ${{ vars.PROD_SEO_HOST || 'fomo4good.com' }}
        run: node .github/scripts/smoke-site.mjs

      - name: Summary
        if: always()
        env:
          SITE_URL: https://${{ vars.STAGING_SITE_HOST || 'fomo4good.afsd.io' }}/
          SMOKE_FAILED: ${{ steps.smoke.outputs.failed }}
        run: |
          version="$(grep -E '^version:' blocklets/fomo4good/blocklet.yaml | awk '{print $2}')"
          {
            echo "## FOMO4GOOD → staging"
            echo ""
            echo "- Blocklet: fomo4good@${version} (${GITHUB_SHA::7})"
            echo "- Site: ${SITE_URL}"
            echo "- Smoke: ${SMOKE_FAILED:-not run} failed"
          } >> "$GITHUB_STEP_SUMMARY"
