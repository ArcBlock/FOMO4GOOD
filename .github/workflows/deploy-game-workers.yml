name: Deploy Game Workers
on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [staging, production]
        default: staging
        required: true
      arc_ref:
        description: Exact merged ARC commit containing the EVM and Service Binding changes
        type: string
        required: true
      owner_did:
        description: DID Space owner DID (or configure the FOMO_OWNER_DID environment variable)
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: fomo-workers-${{ inputs.environment }}
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      FOMO_OWNER_DID: ${{ inputs.owner_did || vars.FOMO_OWNER_DID }}
      FOMO_DEPLOY_ENV: ${{ inputs.environment }}
      ARC_HOME: ${{ github.workspace }}/arc-runtime
    steps:
      - uses: actions/checkout@v5
      - name: Check deployment credentials and identity
        env:
          ARC_SOURCE_TOKEN: ${{ secrets.GIT_HUB_TOKEN }}
          ARC_REF: ${{ inputs.arc_ref }}
        run: |
          missing=0
          for key in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID ARC_SOURCE_TOKEN FOMO_OWNER_DID; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing deployment configuration: $key"
              missing=1
            fi
          done
          [[ "$ARC_REF" =~ ^[a-f0-9]{40}$ ]] || { echo "::error::arc_ref must be an exact commit SHA"; exit 1; }
          test "$missing" = 0
      - name: Checkout private ARC runtime
        uses: actions/checkout@v5
        with:
          repository: ArcBlock/arc
          ref: ${{ inputs.arc_ref }}
          token: ${{ secrets.GIT_HUB_TOKEN }}
          path: arc-runtime
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - name: Build pinned ARC dependencies
        working-directory: arc-runtime
        run: |
          # Private source/build logs stay on the runner, never in public logs/artifacts.
          pnpm install --frozen-lockfile > "$RUNNER_TEMP/arc-install.log" 2>&1 || { echo "::error::ARC dependency install failed"; exit 1; }
          pnpm build > "$RUNNER_TEMP/arc-build.log" 2>&1 || { echo "::error::ARC build failed"; exit 1; }
      - name: Verify game workers
        run: |
          npm ci
          npm test
          npm run build:worker
          npm run test:worker
      - name: Deploy practice workers
        run: node scripts/deploy-workers.mjs
      - name: Verify live practice API
        run: node scripts/smoke-workers.mjs
